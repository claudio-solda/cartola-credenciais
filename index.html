<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161616">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Meu Cartola — Acesso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Chivo:wght@400;600;900&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch:#7A2A0F;
    --pitch-dark:#4A1608;
    --chalk:#F4F1E6;
    --gold:#FF7A33;
    --gold-dim:#B24E1D;
    --danger:#E8938A;
    --line: rgba(244,241,230,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Chivo', sans-serif;
    background: repeating-conic-gradient(#161616 0% 25%, #B3261E 0% 50%) 0 0/72px 72px;
    color:var(--chalk);
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 60px;
  }
  h1,h2,.display{
    font-family:'Bebas Neue', sans-serif;
    letter-spacing:0.04em;
    font-weight:400;
  }
  .wrap{width:100%;max-width:440px;}

  /* ---- Lock screen ---- */
  #lock{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:80vh;
    text-align:center;
  }
  .badge{
    width:120px;height:120px;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:14px;
  }
  .badge svg{width:100%;height:100%;filter:drop-shadow(0 8px 18px rgba(0,0,0,0.4));}
  #lock h1{font-size:40px;margin:0 0 4px;color:var(--chalk);}
  #lock p.sub{color:#C7D6CC;margin:0 0 28px;font-size:14px;}
  .lock-input{
    width:100%;max-width:280px;
    background:rgba(244,241,230,0.06);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    color:var(--chalk);
    font-size:16px;
    letter-spacing:0.3em;
    text-align:center;
    margin-bottom:14px;
  }
  .lock-input:focus{outline:none;border-color:var(--gold);}
  .btn{
    border:none;border-radius:10px;
    padding:14px 20px;
    font-family:'Chivo',sans-serif;font-weight:600;font-size:15px;
    cursor:pointer;
    transition:transform .08s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-gold{background:var(--gold);color:var(--pitch-dark);}
  .btn-ghost{background:transparent;color:var(--chalk);border:1px solid var(--line);}
  .btn-block{width:100%;max-width:280px;}
  #lock-error{color:#E8938A;font-size:13px;height:16px;margin-bottom:6px;}
  #biometric-btn{margin-top:10px;font-size:13px;opacity:0.85;}

  /* ---- Main app ---- */
  #app{display:none;width:100%;}
  #app.visible{display:block;}
  header.top{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--line);
  }
  header.top h1{font-size:32px;color:var(--gold);margin:0;}
  header.top .lockbtn{background:none;border:none;color:#C7D6CC;font-size:12px;cursor:pointer;text-decoration:underline;}

  section.card{
    background:rgba(244,241,230,0.05);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px;
    margin-bottom:18px;
  }
  section.card h2{font-size:22px;color:var(--chalk);margin:0 0 4px;}
  section.card p.eyebrow{
    font-size:11px;text-transform:uppercase;letter-spacing:0.14em;
    color:var(--gold);margin:0 0 10px;font-weight:600;font-family:'Chivo',sans-serif;
  }
  label{display:block;font-size:12px;color:#C7D6CC;margin:12px 0 6px;}
  input[type=text],input[type=email],input[type=password]{
    width:100%;
    background:rgba(0,0,0,0.2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 12px;
    color:var(--chalk);
    font-family:'Chivo',sans-serif;
    font-size:15px;
  }
  input:focus{outline:none;border-color:var(--gold);}
  .pw-row{position:relative;}
  .pw-row button{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    background:#1B1B1B;border:1px solid var(--gold-dim);color:var(--chalk);
    font-size:12px;font-weight:600;cursor:pointer;
    padding:6px 10px;border-radius:6px;
  }
  .save-row{display:flex;gap:10px;margin-top:16px;}
  .save-row .btn{flex:1;}
  .saved-tag{font-size:12px;color:#9FD6B4;margin-top:8px;display:none;}

  /* team cards */
  .team-card{
    position:relative;
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 40px 6px 14px;
    margin-bottom:12px;
    background:rgba(0,0,0,0.12);
  }
  .team-card label{margin:0 0 5px;font-size:13px;}
  .team-card input{padding:11px 12px;font-size:17px;margin-bottom:10px;}
  .team-card .pw-row input{margin-bottom:0;padding-right:78px;}
  .team-card .del{
    position:absolute;top:10px;right:8px;
    background:none;border:none;color:#E8938A;font-size:20px;cursor:pointer;
    line-height:1;padding:4px 8px;
  }
  .add-team{
    margin-top:14px;width:100%;background:transparent;color:var(--gold);
    border:1px dashed var(--gold-dim);border-radius:8px;padding:10px;
    font-family:'Chivo',sans-serif;font-size:14px;cursor:pointer;
  }
  .empty-hint{font-size:13px;color:#8FA697;padding:8px 0;}
  footer.credit{text-align:center;color:#6E8577;font-size:11px;margin-top:8px;}
</style>
</head>
<body>

<div class="wrap">

  <!-- LOCK SCREEN -->
  <div id="lock">
    <div class="badge">
      <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="bgGrad" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#2A2A2A"/>
            <stop offset="100%" stop-color="#0C0C0C"/>
          </radialGradient>
          <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F2F2F2"/>
            <stop offset="50%" stop-color="#B8BCC0"/>
            <stop offset="100%" stop-color="#8A8F94"/>
          </linearGradient>
        </defs>
        <circle cx="60" cy="60" r="58" fill="url(#bgGrad)" stroke="url(#silver)" stroke-width="1.5"/>
        <!-- cartola / top hat, desenho estilo linha -->
        <ellipse cx="60" cy="78" rx="30" ry="7" fill="none" stroke="url(#silver)" stroke-width="3" stroke-linecap="round"/>
        <path d="M40 78 L44 42 C44 35 76 35 76 42 L80 78" fill="#0c0c0c" stroke="url(#silver)" stroke-width="3" stroke-linejoin="round"/>
        <path d="M44 50 L76 50" stroke="url(#silver)" stroke-width="3" stroke-linecap="round"/>
        <path d="M44 50 C40 50 40 58 44 58 L76 58 C80 58 80 50 76 50" fill="none" stroke="url(#silver)" stroke-width="2.5"/>
        <!-- bolinha na aba, referência ao Cartola FC -->
        <circle cx="60" cy="94" r="5.5" fill="url(#silver)"/>
        <path d="M60 90.5 L62 92.5 L61.2 95 L58.8 95 L58 92.5 Z" fill="#0c0c0c"/>
      </svg>
    </div>
    <h1>Meu Cartola</h1>
    <p class="sub" id="lock-sub">Crie uma senha de acesso para este app</p>
    <div id="lock-error"></div>
    <input type="password" id="lock-input" class="lock-input" placeholder="Senha de acesso" maxlength="20" inputmode="text">
    <input type="password" id="lock-input-confirm" class="lock-input" placeholder="Confirme a senha" maxlength="20" style="display:none;">
    <button class="btn btn-gold btn-block" id="lock-btn">Criar senha</button>
    <button class="btn btn-ghost btn-block" id="biometric-btn" style="display:none;">Usar impressão digital</button>
    <a href="#" id="forgot-link" style="display:none;margin-top:10px;font-size:12px;color:#94a3b8;text-decoration:underline;">Esqueci minha senha</a>
    <div id="forgot-box" style="display:none;flex-direction:column;gap:8px;margin-top:8px;width:100%;">
      <input type="password" id="master-input" class="lock-input" placeholder="Senha mestra" maxlength="20">
      <button class="btn btn-ghost btn-block" id="master-btn">Redefinir senha</button>
      <div id="master-msg" style="font-size:12px;min-height:16px;"></div>
    </div>
  </div>

  <!-- APP -->
  <div id="app">
    <header class="top">
      <h1>Meu Cartola</h1>
      <button class="lockbtn" id="relock-btn">bloquear</button>
    </header>

    <section class="card">
      <p class="eyebrow">Login do Cartola FC</p>
      <h2>Meus times</h2>
      <div id="teams-list"></div>
      <p class="empty-hint" id="teams-empty">Nenhum time cadastrado ainda.</p>
      <button class="add-team" id="add-team-btn">+ adicionar time</button>
    </section>

    <footer class="credit">Salvo apenas neste aparelho</footer>
  </div>

</div>

<script>
(function(){
  var LOCK_KEY = 'cartola_lock_hash_v1';
  var MASTER_PASSWORD = '0198';
  var ACC_KEY = 'cartola_account_v1';
  var TEAMS_KEY = 'cartola_teams_v1';
  var WEBAUTHN_KEY = 'cartola_webauthn_id_v1';

  var lockEl = document.getElementById('lock');
  var appEl = document.getElementById('app');
  var lockInput = document.getElementById('lock-input');
  var lockConfirm = document.getElementById('lock-input-confirm');
  var lockBtn = document.getElementById('lock-btn');
  var lockSub = document.getElementById('lock-sub');
  var lockError = document.getElementById('lock-error');
  var bioBtn = document.getElementById('biometric-btn');

  function sha256(text){
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest('SHA-256', enc).then(function(buf){
      return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    });
  }

  var hasLock = !!localStorage.getItem(LOCK_KEY);
  var creatingPassword = !hasLock;

  function refreshLockUI(){
    if(creatingPassword){
      lockSub.textContent = 'Crie uma senha de acesso para este app';
      lockConfirm.style.display = 'block';
      lockBtn.textContent = 'Criar senha';
      document.getElementById('forgot-link').style.display = 'none';
    } else {
      lockSub.textContent = 'Digite sua senha para continuar';
      lockConfirm.style.display = 'none';
      lockBtn.textContent = 'Entrar';
      document.getElementById('forgot-link').style.display = 'block';
    }
  }
  refreshLockUI();

  var forgotLink = document.getElementById('forgot-link');
  var forgotBox = document.getElementById('forgot-box');
  var masterBtn = document.getElementById('master-btn');
  var masterInput = document.getElementById('master-input');
  var masterMsg = document.getElementById('master-msg');
  forgotLink.addEventListener('click', function(e){
    e.preventDefault();
    forgotBox.style.display = forgotBox.style.display === 'flex' ? 'none' : 'flex';
  });
  masterBtn.addEventListener('click', function(){
    if(masterInput.value === MASTER_PASSWORD){
      localStorage.removeItem(LOCK_KEY);
      localStorage.removeItem(WEBAUTHN_KEY);
      masterMsg.style.color = '#a7f3d0';
      masterMsg.textContent = 'Senha apagada! Recarregando para criar uma nova...';
      setTimeout(function(){ location.reload(); }, 1200);
    } else {
      masterMsg.style.color = '#ffb4b4';
      masterMsg.textContent = 'Senha mestra incorreta.';
    }
  });

  // Offer WebAuthn (fingerprint) if available and already set up, or offer to set up after password creation
  function webauthnAvailable(){
    return !!(window.PublicKeyCredential && navigator.credentials);
  }

  async function tryBiometricUnlock(){
    try{
      var credIdB64 = localStorage.getItem(WEBAUTHN_KEY);
      if(!credIdB64) return false;
      var credId = Uint8Array.from(atob(credIdB64), c=>c.charCodeAt(0));
      var challenge = crypto.getRandomValues(new Uint8Array(32));
      await navigator.credentials.get({
        publicKey:{
          challenge: challenge,
          allowCredentials:[{id:credId, type:'public-key'}],
          userVerification:'required',
          timeout:30000
        }
      });
      unlockApp();
      return true;
    }catch(e){
      return false;
    }
  }

  async function setupBiometric(){
    try{
      var userId = crypto.getRandomValues(new Uint8Array(16));
      var challenge = crypto.getRandomValues(new Uint8Array(32));
      var cred = await navigator.credentials.create({
        publicKey:{
          challenge: challenge,
          rp:{name:'Meu Cartola'},
          user:{id:userId, name:'cartola-user', displayName:'Cartola'},
          pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
          authenticatorSelection:{authenticatorAttachment:'platform', userVerification:'required'},
          timeout:30000
        }
      });
      var idB64 = btoa(String.fromCharCode.apply(null, new Uint8Array(cred.rawId)));
      localStorage.setItem(WEBAUTHN_KEY, idB64);
    }catch(e){ /* silently skip if unsupported/cancelled */ }
  }

  if(hasLock && webauthnAvailable() && localStorage.getItem(WEBAUTHN_KEY)){
    bioBtn.style.display = 'block';
    bioBtn.textContent = 'Usar impressão digital';
  }
  bioBtn.addEventListener('click', tryBiometricUnlock);
  if(hasLock && localStorage.getItem(WEBAUTHN_KEY)){
    // auto-prompt once on load
    setTimeout(tryBiometricUnlock, 300);
  }

  lockBtn.addEventListener('click', async function(){
    var val = lockInput.value.trim();
    if(val.length < 4){
      lockError.textContent = 'Use ao menos 4 caracteres.';
      return;
    }
    if(creatingPassword){
      var confirmVal = lockConfirm.value.trim();
      if(val !== confirmVal){
        lockError.textContent = 'As senhas não coincidem.';
        return;
      }
      var hash = await sha256(val);
      localStorage.setItem(LOCK_KEY, hash);
      unlockApp();
      if(webauthnAvailable()){
        setupBiometric();
      }
    } else {
      var storedHash = localStorage.getItem(LOCK_KEY);
      var tryHash = await sha256(val);
      if(tryHash === storedHash){
        unlockApp();
      } else {
        lockError.textContent = 'Senha incorreta.';
        lockInput.value = '';
      }
    }
  });

  function unlockApp(){
    lockEl.style.display = 'none';
    appEl.classList.add('visible');
    loadTeams();
  }

  document.getElementById('relock-btn').addEventListener('click', function(){
    location.reload();
  });

  // ---- Times (nome + e-mail + senha, um login diferente por time) ----
  var teamsList = document.getElementById('teams-list');
  var teamsEmpty = document.getElementById('teams-empty');

  function getTeams(){
    var raw = localStorage.getItem(TEAMS_KEY);
    return raw ? JSON.parse(raw) : [];
  }
  function setTeams(teams){
    localStorage.setItem(TEAMS_KEY, JSON.stringify(teams));
  }

  // Migra dados da versão anterior: conta única (ACC_KEY) e times sem senha
  function migrateOldData(){
    var teams = getTeams();
    var changed = false;
    teams.forEach(function(t){
      if(typeof t.pass === 'undefined'){ t.pass = ''; changed = true; }
    });
    var accRaw = localStorage.getItem(ACC_KEY);
    if(accRaw){
      var acc = JSON.parse(accRaw);
      if(acc.email || acc.pass){
        teams.unshift({name:'Minha conta', email: acc.email || '', pass: acc.pass || ''});
        changed = true;
      }
      localStorage.removeItem(ACC_KEY);
    }
    if(changed) setTeams(teams);
  }

  function renderTeams(){
    var teams = getTeams();
    teamsList.innerHTML = '';
    teamsEmpty.style.display = teams.length ? 'none' : 'block';
    teams.forEach(function(team, idx){
      var card = document.createElement('div');
      card.className = 'team-card';

      var nameLabel = document.createElement('label');
      nameLabel.textContent = 'Nome do time';
      var nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.placeholder = 'Nome do time';
      nameInput.value = team.name || '';
      nameInput.addEventListener('input', function(){
        var t = getTeams(); t[idx].name = nameInput.value; setTeams(t);
      });

      var emailLabel = document.createElement('label');
      emailLabel.textContent = 'E-mail';
      var emailInput = document.createElement('input');
      emailInput.type = 'email';
      emailInput.placeholder = 'e-mail@exemplo.com';
      emailInput.value = team.email || '';
      emailInput.addEventListener('input', function(){
        var t = getTeams(); t[idx].email = emailInput.value; setTeams(t);
      });

      var passLabel = document.createElement('label');
      passLabel.textContent = 'Senha';
      var pwRow = document.createElement('div');
      pwRow.className = 'pw-row';
      var passInput = document.createElement('input');
      passInput.type = 'password';
      passInput.placeholder = '••••••••';
      passInput.value = team.pass || '';
      passInput.addEventListener('input', function(){
        var t = getTeams(); t[idx].pass = passInput.value; setTeams(t);
      });
      var toggleBtn = document.createElement('button');
      toggleBtn.type = 'button';
      toggleBtn.textContent = 'mostrar';
      toggleBtn.addEventListener('click', function(){
        if(passInput.type === 'password'){
          passInput.type = 'text'; toggleBtn.textContent = 'ocultar';
        } else {
          passInput.type = 'password'; toggleBtn.textContent = 'mostrar';
        }
      });
      pwRow.appendChild(passInput);
      pwRow.appendChild(toggleBtn);

      var delBtn = document.createElement('button');
      delBtn.className = 'del';
      delBtn.innerHTML = '&times;';
      delBtn.addEventListener('click', function(){
        var t = getTeams(); t.splice(idx,1); setTeams(t); renderTeams();
      });

      card.appendChild(delBtn);
      card.appendChild(nameLabel);
      card.appendChild(nameInput);
      card.appendChild(emailLabel);
      card.appendChild(emailInput);
      card.appendChild(passLabel);
      card.appendChild(pwRow);
      teamsList.appendChild(card);
    });
  }

  function loadTeams(){
    migrateOldData();
    renderTeams();
  }

  document.getElementById('add-team-btn').addEventListener('click', function(){
    var teams = getTeams();
    teams.push({name:'', email:'', pass:''});
    setTeams(teams);
    renderTeams();
    var cards = teamsList.querySelectorAll('.team-card');
    if(cards.length){
      var lastCard = cards[cards.length-1];
      var firstInput = lastCard.querySelector('input');
      if(firstInput) firstInput.focus();
    }
  });

})();
</script>
</body>
</html>
